[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expnote"
version = "0.1.0"
description = "A local-first experiment note CLI with SQLite and Markdown projections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "expnote contributors" }]
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
expnote = "expnote.cli:app"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
