[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expnote"
version = "0.1.0"
description = "A local-first experiment note CLI with SQLite and Markdown projections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "expnote contributors" }]
dependencies = [
  "fastapi>=0.115",
  "markdown>=3.6",
  "plotly>=5.24",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
charts = [
  "matplotlib>=3.8",
  "numpy>=2",
]
research = [
  "pyyaml>=6",
]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.8",
]

[project.scripts]
expnote = "expnote.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["expnote"]
# The research GUI is plain static files next to the Python code (no build step).
artifacts = [
  "expnote/research/static/*.html",
  "expnote/research/static/*.js",
  "expnote/research/static/*.css",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
